<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Gimnasio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Administrador</h1>
        <p>Gestión de miembros, pagos, vigencia y membresías.</p>
    </header>

    <main>
        <section>
            <h2>Control de Miembros</h2>
            <p>Listado general de clientes registrados:</p>
            
            <table border="1" cellpadding="10" style="width:100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr style="background-color: #f1f5f9;">
                        <th>ID (4 dígitos)</th>
                        <th>Nombre del Miembro</th>
                        <th>Membresía</th>
                        <th>Fecha de Registro</th>
                        <th>Vigencia Restante</th>
                        <th>Estatus</th>
                    </tr>
                </thead>
                <tbody id="tabla-miembros">
                </tbody>
            </table>
        </section>

        <section style="margin-top: 30px;">
            <h2>Registrar Nuevo Miembro</h2>
            <form id="form-admin-miembro" style="margin-top: 15px;">
                <div style="margin-bottom: 10px;">
                    <label for="nombre" style="display: block; font-weight: bold;">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;" required>
                </div>
                <div style="margin-bottom: 10px;">
                    <label for="membresia" style="display: block; font-weight: bold;">Tipo de Membresía:</label>
                    <select id="membresia" name="membresia" style="width: 100%; padding: 8px; margin-top: 5px;">
                        <option value="Mensual">Mensual (30 días)</option>
                        <option value="Anual">Anual (365 días)</option>
                        <option value="Visita">Visita (1 día)</option>
                    </select>
                </div>
                <button type="submit" style="background-color: #2563eb; color: white; padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Guardar Miembro</button>
            </form>
        </section>
    </main>

    <footer>
        <p style="margin-top: 20px;"><a href="index.html">← Cerrar sesión / Volver al inicio</a></p>
    </footer>

    <script>
        function obtenerMiembros() {
            let miembros = JSON.parse(localStorage.getItem("gym_miembros"));
            if (!miembros) {
                miembros = [
                    { id: "1001", nombre: "Carlos Santana", membresia: "Mensual", fechaRegistro: "2026-05-10", duracionDias: 30, pesoAnterior: 80.0, fechaAnterior: "10/05/2026" },
                    { id: "1002", nombre: "María López", membresia: "Anual", fechaRegistro: "2025-06-01", duracionDias: 365, pesoAnterior: null, fechaAnterior: null }
                ];
                localStorage.setItem("gym_miembros", JSON.stringify(miembros));
            }
            return miembros;
        }

        function calcularVigencia(fechaRegistroStr, duracionDias) {
            const fechaRegistro = new Date(fechaRegistroStr);
            const hoy = new Date();
            const diasTranscurridos = Math.floor((hoy - fechaRegistro) / (1000 * 60 * 60 * 24));
            return duracionDias - diasTranscurridos;
        }

        function renderizarTabla() {
            const miembros = obtenerMiembros();
            const tbody = document.getElementById("tabla-miembros");
            tbody.innerHTML = "";

            miembros.forEach(m => {
                const diasRestantes = calcularVigencia(m.fechaRegistro, m.duracionDias);
                let estatusHtml = "";
                let colorTexto = "";

                if (diasRestantes > 5) {
                    estatusHtml = "Activo";
                    colorTexto = "color: green; font-weight: bold;";
                } else if (diasRestantes > 0) {
                    estatusHtml = "Por Vencer";
                    colorTexto = "color: orange; font-weight: bold;";
                } else {
                    estatusHtml = "Vencido";
                    colorTexto = "color: red; font-weight: bold;";
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${m.id}</td>
                    <td>${m.nombre}</td>
                    <td>${m.membresia}</td>
                    <td>${m.fechaRegistro}</td>
                    <td>${diasRestantes > 0 ? diasRestantes + " días" : "Expirado"}</td>
                    <td style="${colorTexto}">${estatusHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function generarIdUnico(miembros) {
            let nuevoId;
            do {
                nuevoId = Math.floor(1000 + Math.random() * 9000).toString();
            } while (miembros.some(m => m.id === nuevoId));
            return nuevoId;
        }

        document.getElementById("form-admin-miembro").addEventListener("submit", function(e) {
            e.preventDefault();
            const nombre = document.getElementById("nombre").value.trim();
            const tipoMembresia = document.getElementById("membresia").value;

            if (nombre === "") {
                alert("Por favor, ingresa el nombre completo.");
                return;
            }

            let miembros = obtenerMiembros();
            const nuevoId = generarIdUnico(miembros);
            const hoyStr = new Date().toISOString().split('T')[0];

            let duracion = 30;
            if (tipoMembresia === "Anual") duracion = 365;
            if (tipoMembresia === "Visita") duracion = 1;

            const nuevoSocio = {
                id: nuevoId,
                nombre: nombre,
                membresia: tipoMembresia,
                fechaRegistro: hoyStr,
                duracionDias: duracion,
                pesoAnterior: null,
                fechaAnterior: null
            };

            miembros.push(nuevoSocio);
            localStorage.setItem("gym_miembros", JSON.stringify(miembros));

            alert(`Miembro registrado con éxito. Su ID asignado de 4 dígitos es: ${nuevoId}`);
            document.getElementById("form-admin-miembro").reset();
            renderizarTabla();
        });

        window.onload = renderizarTabla;
    </script>
</body>
</html>
